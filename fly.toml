# fly.toml app configuration file for TALHA-MD
app = 'talha-md'
primary_region = 'sin'

[build]

[env]
  PORT = '3000'
  BOT_NAME = 'TALHA MD'
  OWNER_NAME = 'Talha Sheikh'
  OWNER_NUMBER = '923426767199'
  THEME = 'talha'
  MODE = 'both'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    timeout = '10s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
